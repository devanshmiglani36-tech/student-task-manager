","xl":"0.5rem","full":"0.75rem"},"spacing":{"space-md":"1rem","space-sm":"0.5rem","space-xl":"2rem","space-xs":"0.25rem","space-lg":"1.5rem","margin":"1.5rem","gutter":"1rem"},"fontFamily":{"headline-md":["Space Grotesk"],"title-lg":["Geist"],"label-lg":["Geist"],"headline-lg-mobile":["Space Grotesk"],"body-lg":["Geist"],"body-sm":["Geist"],"body-md":["Geist"],"label-md":["Geist"],"label-sm":["Geist"],"headline-lg":["Space Grotesk"],"headline-sm":["Space Grotesk"],"title-md":["Geist"]},"fontSize":{"headline-md":["24px",{"lineHeight":"32px","letterSpacing":"-0.015em","fontWeight":"600"}],"title-lg":["18px",{"lineHeight":"26px","fontWeight":"600"}],"label-lg":["14px",{"lineHeight":"20px","letterSpacing":"0.01em","fontWeight":"500"}],"headline-lg-mobile":["28px",{"lineHeight":"36px","letterSpacing":"-0.02em","fontWeight":"700"}],"body-lg":["16px",{"lineHeight":"24px","fontWeight":"400"}],"body-sm":["12px",{"lineHeight":"16px","fontWeight":"400"}],"body-md":["14px",{"lineHeight":"20px","fontWeight":"400"}],"label-md":["12px",{"lineHeight":"16px","letterSpacing":"0.02em","fontWeight":"500"}],"label-sm":["11px",{"lineHeight":"14px","letterSpacing":"0.04em","fontWeight":"600"}],"headline-lg":["36px",{"lineHeight":"44px","letterSpacing":"-0.02em","fontWeight":"700"}],"headline-sm":["20px",{"lineHeight":"28px","letterSpacing":"-0.01em","fontWeight":"600"}],"title-md":["16px",{"lineHeight":"24px","fontWeight":"600"}]}}}}</script><style>

  </head><body class="bg-surface text-on-surface font-body-md text-body-md pt-safe pb-safe flex flex-col min-h-screen"><main class="flex flex-col relative w-full px-space-md bg-surface min-h-screen justify-center"><div class="flex flex-col w-full py-space-lg">
<div class="relative w-full max-w-md mx-auto">
<div class="absolute -inset-1 rounded-full bg-gradient-to-tr from-primary-container/25 via-secondary-container/20 to-tertiary/15 blur-2xl opacity-70 pointer-events-none"></div>
<div class="relative bg-surface-container rounded-xl p-space-lg shadow-xl overflow-hidden">
<div class="absolute top-0 right-0 w-36 h-36 bg-gradient-to-bl from-primary-container/15 to-transparent rounded-bl-full pointer-events-none"></div>
<div class="flex flex-col items-center text-center mb-space-lg">
<div class="flex items-center justify-center w-12 h-12 rounded-xl bg-gradient-to-br from-secondary-container to-primary-container text-on-primary-container shadow-md mb-space-md">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
<div class="flex items-center gap-space-xs mb-space-xs">
<span class="font-headline-sm text-headline-sm text-on-surface tracking-tight">StudyFlow</span>
<span class="px-2 py-0.5 rounded-full bg-primary-container/20 text-primary font-label-sm text-label-sm">BETA</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-space-xs">Create your student account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Lock in your semester. Organize deadlines, labs, and late-night sprints.</p>
</div>
<form class="flex flex-col gap-space-md" id="register-form" novalidate="">
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="full-name">Full Name</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-lg pointer-events-none">person</span>
<input class="w-full bg-surface-container-lowest text-on-surface placeholder:text-outline/60 font-body-md text-body-md rounded-lg pl-10 pr-space-md py-2.5 focus:outline-none focus:bg-surface-container-low transition-colors" id="full-name" placeholder="Alex Rivera" required="" type="text"/>
</div>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="university-email">University Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-lg pointer-events-none">school</span>
<input class="w-full bg-surface-container-lowest text-on-surface placeholder:text-outline/60 font-body-md text-body-md rounded-lg pl-10 pr-space-md py-2.5 focus:outline-none focus:bg-surface-container-low transition-colors" id="university-email" placeholder="arivera@stanford.edu" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="major">Major / Department</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-lg pointer-events-none">menu_book</span>
<select class="w-full appearance-none bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-lg pl-10 pr-10 py-2.5 focus:outline-none focus:bg-surface-container-low transition-colors cursor-pointer" id="major" required="">
<option class="text-outline" disabled="" selected="" value="">Select your major</option>
<option value="cs">Computer Science</option>
<option value="bio">Biology &amp; Life Sciences</option>
<option value="bus">Business &amp; Economics</option>
<option value="eng">Mechanical Engineering</option>
<option value="psych">Psychology</option>
<option value="design">Digital Media &amp; Design</option>
</select>
<span class="material-symbols-outlined absolute right-3 text-outline text-lg pointer-events-none">expand_more</span>
</div>
</div>
<div class="grid grid-cols-1 gap-space-md">
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-lg pointer-events-none">lock</span>
<input class="w-full bg-surface-container-lowest text-on-surface placeholder:text-outline/60 font-body-md text-body-md rounded-lg pl-10 pr-10 py-2.5 focus:outline-none focus:bg-surface-container-low transition-colors" id="password" placeholder="At least 8 characters" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 text-outline hover:text-on-surface transition-colors flex items-center justify-center" data-toggle="password" type="button">
<span class="material-symbols-outlined text-lg">visibility</span>
</button>
</div>
<div class="flex items-center gap-space-xs pt-1">
<div class="h-1 flex-1 rounded-full bg-surface-container-highest transition-colors" id="strength-bar-1"></div>
<div class="h-1 flex-1 rounded-full bg-surface-container-highest transition-colors" id="strength-bar-2"></div>
<div class="h-1 flex-1 rounded-full bg-surface-container-highest transition-colors" id="strength-bar-3"></div>
<span class="font-label-sm text-label-sm text-outline ml-1" id="strength-label">Strength</span>
</div>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="confirm-password">Confirm Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-lg pointer-events-none">verified_user</span>
<input class="w-full bg-surface-container-lowest text-on-surface placeholder:text-outline/60 font-body-md text-body-md rounded-lg pl-10 pr-10 py-2.5 focus:outline-none focus:bg-surface-container-low transition-colors" id="confirm-password" placeholder="Re-enter password" required="" type="password"/>
<button aria-label="Toggle confirm password visibility" class="absolute right-3 text-outline hover:text-on-surface transition-colors flex items-center justify-center" data-toggle="confirm-password" type="button">
<span class="material-symbols-outlined text-lg">visibility</span>
</button>
</div>
</div>
</div>
<label class="flex items-start gap-space-sm cursor-pointer select-none pt-space-xs" for="terms">
<div class="relative flex items-center justify-center mt-0.5">
<input class="peer sr-only" id="terms" required="" type="checkbox"/>
<div class="w-4 h-4 rounded bg-surface-container-lowest peer-checked:bg-primary-container flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-on-primary-container text-xs opacity-0 peer-checked:opacity-100 transition-opacity" style="font-variation-settings: 'wght' 700;">check</span>
</div>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant leading-snug">
            I agree to the <a class="text-primary hover:underline font-medium" href="#">Terms of Service</a> and <a class="text-primary hover:underline font-medium" href="#">Privacy Policy</a>.
          </span>
</label>
<div class="hidden rounded-lg px-space-md py-space-sm font-body-sm text-body-sm" id="form-feedback"></div>
<button class="w-full mt-space-xs py-3 px-space-md rounded-lg bg-gradient-to-r from-secondary-container via-inverse-primary to-primary-container text-on-primary-container font-label-lg text-label-lg shadow-lg hover:brightness-110 active:scale-[0.99] transition-all flex items-center justify-center gap-space-sm" id="submit-btn" type="submit">
<span>Create Account</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
<div class="mt-space-lg pt-space-md bg-surface-container-low -mx-space-lg -mb-space-lg px-space-lg py-space-md text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
          Already have an account?
          <a class="text-primary font-label-lg text-label-lg hover:underline ml-1" href="#">Sign in</a>
</p>
</div>
</div>
</div>
</div>
<script>
  (function () {
    const toggleButtons = document.querySelectorAll('[data-toggle]');
    toggleButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        const targetId = btn.getAttribute('data-toggle');
        const input = document.getElementById(targetId);
        const icon = btn.querySelector('.material-symbols-outlined');
        if (!input) return;
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        icon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    });

    const passwordInput = document.getElementById('password');
    const bar1 = document.getElementById('strength-bar-1');
    const bar2 = document.getElementById('strength-bar-2');
    const bar3 = document.getElementById('strength-bar-3');
    const strengthLabel = document.getElementById('strength-label');

    if (passwordInput) {
      passwordInput.addEventListener('input', () => {
        const val = passwordInput.value;
        let score = 0;
        if (val.length >= 6) score++;
        if (val.length >= 8 && /[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
        if (val.length >= 10 && /[^A-Za-z0-9]/.test(val)) score++;

        bar1.className = 'h-1 flex-1 rounded-full transition-colors ' + (score >= 1 ? 'bg-error' : 'bg-surface-container-highest');
        bar2.className = 'h-1 flex-1 rounded-full transition-colors ' + (score >= 2 ? 'bg-secondary' : 'bg-surface-container-highest');
        bar3.className = 'h-1 flex-1 rounded-full transition-colors ' + (score >= 3 ? 'bg-tertiary' : 'bg-surface-container-highest');

        if (score === 0) {
          strengthLabel.textContent = 'Strength';
          strengthLabel.className = 'font-label-sm text-label-sm text-outline ml-1';
        } else if (score === 1) {
          strengthLabel.textContent = 'Weak';
          strengthLabel.className = 'font-label-sm text-label-sm text-error ml-1';
        } else if (score === 2) {
          strengthLabel.textContent = 'Good';
          strengthLabel.className = 'font-label-sm text-label-sm text-secondary ml-1';
        } else {
          strengthLabel.textContent = 'Strong';
          strengthLabel.className = 'font-label-sm text-label-sm text-tertiary ml-1';
        }
      });
    }

    const form = document.getElementById('register-form');
    const feedback = document.getElementById('form-feedback');
    const submitBtn = document.getElementById('submit-btn');

    if (form) {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('full-name').value.trim();
        const email = document.getElementById('university-email').value.trim();
        const major = document.getElementById('major').value;
        const pass = document.getElementById('password').value;
        const confirmPass = document.getElementById('confirm-password').value;
        const terms = document.getElementById('terms').checked;

        feedback.classList.remove('hidden', 'bg-error-container', 'text-on-error-container', 'bg-tertiary-container', 'text-on-tertiary-container');

        if (!name || !email || !major || !pass || !confirmPass) {
          feedback.textContent = 'Please fill in all required fields.';
          feedback.classList.add('bg-error-container', 'text-on-error-container');
          return;
        }
        if (pass !== confirmPass) {
          feedback.textContent = 'Passwords do not match.';
          feedback.classList.add('bg-error-container', 'text-on-error-container');
          return;
        }
        if (!terms) {
          feedback.textContent = 'Please accept the Terms of Service to continue.';
          feedback.classList.add('bg-error-container', 'text-on-error-container');
          return;
        }

        submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-lg">progress_activity</span><span>Creating workspace...</span>';
        setTimeout(() => {
          feedback.textContent = 'Welcome to StudyFlow, ' + name.split(' ')[0] + '! Your student workspace is ready.';
          feedback.classList.add('bg-tertiary-container', 'text-on-tertiary-container');
          submitBtn.innerHTML = '<span>Account Created</span><span class="material-symbols-outlined text-lg">check_circle</span>';
        }, 650);
      });
    }
  })();
</script></main></body></html>
