","xl":"0.5rem","full":"0.75rem"},"spacing":{"space-md":"1rem","space-sm":"0.5rem","space-xl":"2rem","space-xs":"0.25rem","space-lg":"1.5rem","margin":"1.5rem","gutter":"1rem"},"fontFamily":{"headline-md":["Space Grotesk"],"title-lg":["Geist"],"label-lg":["Geist"],"headline-lg-mobile":["Space Grotesk"],"body-lg":["Geist"],"body-sm":["Geist"],"body-md":["Geist"],"label-md":["Geist"],"label-sm":["Geist"],"headline-lg":["Space Grotesk"],"headline-sm":["Space Grotesk"],"title-md":["Geist"]},"fontSize":{"headline-md":["24px",{"lineHeight":"32px","letterSpacing":"-0.015em","fontWeight":"600"}],"title-lg":["18px",{"lineHeight":"26px","fontWeight":"600"}],"label-lg":["14px",{"lineHeight":"20px","letterSpacing":"0.01em","fontWeight":"500"}],"headline-lg-mobile":["28px",{"lineHeight":"36px","letterSpacing":"-0.02em","fontWeight":"700"}],"body-lg":["16px",{"lineHeight":"24px","fontWeight":"400"}],"body-sm":["12px",{"lineHeight":"16px","fontWeight":"400"}],"body-md":["14px",{"lineHeight":"20px","fontWeight":"400"}],"label-md":["12px",{"lineHeight":"16px","letterSpacing":"0.02em","fontWeight":"500"}],"label-sm":["11px",{"lineHeight":"14px","letterSpacing":"0.04em","fontWeight":"600"}],"headline-lg":["36px",{"lineHeight":"44px","letterSpacing":"-0.02em","fontWeight":"700"}],"headline-sm":["20px",{"lineHeight":"28px","letterSpacing":"-0.01em","fontWeight":"600"}],"title-md":["16px",{"lineHeight":"24px","fontWeight":"600"}]}}}}</script><style>

  </head><body class="bg-surface text-on-surface font-body-md text-body-md pt-safe pb-safe flex flex-col min-h-screen"><main class="flex flex-col relative w-full px-space-md bg-surface min-h-screen justify-center"><div class="flex flex-col w-full items-center justify-center py-space-lg relative overflow-hidden">
<div class="absolute -top-12 -right-12 w-48 h-48 rounded-full bg-primary-container/20 blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-12 -left-12 w-48 h-48 rounded-full bg-secondary-container/20 blur-3xl pointer-events-none"></div>
<div class="w-full max-w-md bg-surface-container rounded-xl p-space-lg shadow-xl relative z-10 flex flex-col gap-space-lg">
<div class="flex flex-col items-center text-center gap-space-sm">
<div class="flex items-center gap-space-sm">
<div class="w-10 h-10 rounded-xl bg-gradient-to-br from-secondary-container to-primary-container flex items-center justify-center shadow-md">
<svg class="w-6 h-6 text-on-primary-container" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 3L4 7.5V16.5L12 21L20 16.5V7.5L12 3Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M12 12L20 7.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M12 12V21" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M12 12L4 7.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<span class="font-headline-sm text-headline-sm text-on-surface tracking-tight">StudyFlow</span>
</div>
<div class="flex flex-col gap-space-xs mt-space-xs">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Welcome back, Scholar</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Lock in for tonight’s session. Your deadlines are waiting.</p>
</div>
</div>
<form class="flex flex-col gap-space-md" id="login-form">
<div class="flex flex-col gap-space-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="email">University Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-space-md text-on-surface-variant text-title-lg pointer-events-none">school</span>
<input class="w-full bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md rounded-lg pl-11 pr-space-md py-3 focus:outline-none focus:bg-surface-container-high transition-colors" id="email" placeholder="alex.chen@stanford.edu" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-space-md text-on-surface-variant text-title-lg pointer-events-none">lock</span>
<input class="w-full bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md rounded-lg pl-11 pr-11 py-3 focus:outline-none focus:bg-surface-container-high transition-colors" id="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-space-sm p-space-xs rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container-highest transition-colors flex items-center justify-center" id="toggle-password" type="button">
<span class="material-symbols-outlined text-title-lg" id="toggle-icon">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between pt-space-xs">
<label class="flex items-center gap-space-sm cursor-pointer select-none">
<input class="sr-only" id="remember-me" type="checkbox"/>
<span class="w-[18px] h-[18px] rounded bg-surface-container-highest flex items-center justify-center transition-colors" id="checkbox-box">
<span class="material-symbols-outlined text-body-sm text-on-primary-container opacity-0 transition-opacity" id="checkbox-icon" style="font-variation-settings: 'FILL' 1;">check</span>
</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Remember me</span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed transition-colors" href="#forgot-password">Forgot password?</a>
</div>
<button class="w-full mt-space-xs py-3 px-space-md rounded-lg bg-gradient-to-r from-secondary-container to-primary-container text-on-primary-container font-label-lg text-label-lg shadow-md hover:opacity-95 active:scale-[0.99] transition-all flex items-center justify-center gap-space-sm" id="signin-btn" type="submit">
<span id="signin-text">Sign In</span>
<span class="material-symbols-outlined text-title-md" id="signin-arrow">arrow_forward</span>
</button>
</form>
<div class="flex items-center gap-space-md">
<div class="h-px flex-1 bg-surface-container-highest"></div>
<span class="font-label-sm text-label-sm text-outline uppercase">or</span>
<div class="h-px flex-1 bg-surface-container-highest"></div>
</div>
<button class="w-full py-3 px-space-md rounded-lg bg-surface-container-high hover:bg-surface-container-highest text-on-surface font-label-lg text-label-lg transition-colors flex items-center justify-center gap-space-sm" type="button">
<svg class="w-5 h-5 shrink-0" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span>Continue with Google</span>
</button>
<p class="text-center font-body-sm text-body-sm text-on-surface-variant">
      Don’t have an account?
      <a class="font-label-lg text-label-lg text-primary hover:text-primary-fixed transition-colors ml-space-xs" href="#signup">Sign up</a>
</p>
</div>
</div>
<script>
  const toggleBtn = document.getElementById('toggle-password');
  const passwordInput = document.getElementById('password');
  const toggleIcon = document.getElementById('toggle-icon');

  toggleBtn.addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
  });

  const rememberCheckbox = document.getElementById('remember-me');
  const checkboxBox = document.getElementById('checkbox-box');
  const checkboxIcon = document.getElementById('checkbox-icon');

  rememberCheckbox.addEventListener('change', () => {
    if (rememberCheckbox.checked) {
      checkboxBox.classList.remove('bg-surface-container-highest');
      checkboxBox.classList.add('bg-primary-container');
      checkboxIcon.classList.remove('opacity-0');
    } else {
      checkboxBox.classList.add('bg-surface-container-highest');
      checkboxBox.classList.remove('bg-primary-container');
      checkboxIcon.classList.add('opacity-0');
    }
  });

  const loginForm = document.getElementById('login-form');
  const signinText = document.getElementById('signin-text');
  const signinArrow = document.getElementById('signin-arrow');

  loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    signinText.textContent = 'Entering workspace...';
    signinArrow.textContent = 'bolt';
    setTimeout(() => {
      signinText.textContent = 'Sign In';
      signinArrow.textContent = 'arrow_forward';
    }, 1500);
  });
</script></main></body></html>
