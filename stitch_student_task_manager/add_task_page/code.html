  </head><body class="bg-surface text-on-surface font-body-md text-body-md flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-space-md flex items-center justify-between gap-space-sm"><div class="flex items-center gap-space-sm min-w-0"><button aria-label="Go back" class="w-12 h-12 -ml-2 flex items-center justify-center text-on-surface hover:text-primary transition-colors shrink-0" onclick="history.back()"><span class="material-symbols-outlined">arrow_back_ios_new</span></button><img alt="StudyFlow Logo" class="h-8 w-auto object-contain shrink-0" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDJYQ7n9CvY6tv5dCmwcZiVC1DLyWngPyr3mcr0_Mrz3exLOoUs-ne8H5w9EBukj_fnvEKtsndoWMKOtlpEmvkDpeZ63DQUQswDKr_4eydBmc3s9UNnrwMAc7fTsZiiuVRuWc9w4ueu-u46imLhzu-ZAQS5DJ2WL_wT11mF1NNHGFeUcyj1jND0Ijz4OVn9uCn3MdsLjUQkLT4zhDCUTRLGFhQCOP8_ECGr-ZboeyN0"/><h1 class="font-headline-sm text-headline-sm text-on-surface truncate">Add Task Page</h1></div><img alt="Profile" class="w-8 h-8 rounded-full object-cover shrink-0" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDN1elfW8a72kdjce3-99kfOwYFi3WLdURzlWXb_loHYspkfybHuks8lkX0jkF7wiFydlcZldFjM0_RSddf4i-zYrrKI5toDISaVmvpT3UeAzmdGSowsvhtKcPoPZ-NSc-bkX-dYOlSA3U5Bj1U6Htl99adg1wZd1egAmmxILY9_NvSToea0v_y1Tbe8LaTmHxlY8RQT2gPolBmPaVJRF4yf0mwSCRFJkhTcaRDjRRU"/></div></header><main class="flex flex-col relative w-full px-space-md pt-16 pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full gap-space-md pb-space-xl">
<div class="flex items-center justify-between bg-surface-container-low rounded-xl px-space-md py-space-sm shadow-sm">
<div class="flex items-center gap-space-sm min-w-0">
<span class="w-2 h-2 rounded-full bg-tertiary animate-pulse shrink-0"></span>
<p class="font-body-sm text-body-sm text-on-surface-variant truncate">Lock in your next win — takes 15 seconds</p>
</div>
<span class="font-label-sm text-label-sm text-primary bg-primary-container/20 px-space-sm py-space-xs rounded-lg shrink-0">Fall ’25</span>
</div>
<form class="flex flex-col gap-space-md bg-surface-container rounded-xl p-space-md shadow-xl" id="addTaskForm" onsubmit="return false;">
<div class="flex flex-col gap-space-xs">
<label class="font-label-lg text-label-lg text-on-surface flex items-center justify-between" for="taskTitle">
<span>Task Title</span>
<span class="font-label-sm text-label-sm text-primary">Required</span>
</label>
<input class="w-full bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-lg text-body-lg rounded-lg px-space-md py-space-sm focus:outline-none focus:bg-surface-container-high transition-colors" id="taskTitle" placeholder="e.g., Implement Dijkstra's Algorithm" required="" type="text"/>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="courseSelect">Course / Subject</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-lg px-space-md py-space-sm pr-10 focus:outline-none focus:bg-surface-container-high transition-colors" id="courseSelect">
<option value="CS 301">CS 301 • Data Structures &amp; Algorithms</option>
<option value="PHYS 102">PHYS 102 • Electromagnetism</option>
<option value="ENG 201">ENG 201 • Modern Literature</option>
<option value="MATH 240">MATH 240 • Linear Algebra</option>
<option value="BIO 115">BIO 115 • Cellular Biology</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none text-xl">expand_more</span>
</div>
</div>
<div class="grid grid-cols-2 gap-space-sm">
<div class="flex flex-col gap-space-xs min-w-0">
<label class="font-label-lg text-label-lg text-on-surface" for="dueDate">Due Date</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-lg px-space-sm py-space-sm focus:outline-none focus:bg-surface-container-high transition-colors [color-scheme:dark]" id="dueDate" type="date" value="2025-10-24"/>
</div>
</div>
<div class="flex flex-col gap-space-xs min-w-0">
<label class="font-label-lg text-label-lg text-on-surface" for="dueTime">Due Time</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-lg px-space-sm py-space-sm focus:outline-none focus:bg-surface-container-high transition-colors [color-scheme:dark]" id="dueTime" type="time" value="23:59"/>
</div>
</div>
</div>
<div class="flex flex-col gap-space-xs">
<span class="font-label-lg text-label-lg text-on-surface">Priority</span>
<div class="grid grid-cols-3 gap-space-sm" id="priorityGroup">
<button class="priority-pill flex items-center justify-center gap-space-xs py-space-sm px-space-sm rounded-lg bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md transition-all" data-priority="low" type="button">
<span class="w-2 h-2 rounded-full bg-tertiary"></span>
<span>Low</span>
</button>
<button class="priority-pill flex items-center justify-center gap-space-xs py-space-sm px-space-sm rounded-lg bg-secondary-container text-on-secondary-container font-label-md text-label-md shadow-md transition-all" data-priority="medium" type="button">
<span class="w-2 h-2 rounded-full bg-secondary-fixed"></span>
<span>Medium</span>
</button>
<button class="priority-pill flex items-center justify-center gap-space-xs py-space-sm px-space-sm rounded-lg bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md transition-all" data-priority="high" type="button">
<span class="w-2 h-2 rounded-full bg-error"></span>
<span>High</span>
</button>
</div>
</div>
<div class="flex flex-col gap-space-xs">
<span class="font-label-lg text-label-lg text-on-surface">Category</span>
<div class="flex flex-wrap gap-space-sm" id="categoryGroup">
<button class="category-tag flex items-center gap-space-xs px-space-md py-space-xs rounded-full bg-primary-container text-on-primary-container font-label-md text-label-md shadow-sm transition-all" data-category="Assignment" type="button">
<span class="material-symbols-outlined text-base">assignment</span>
<span>Assignment</span>
</button>
<button class="category-tag flex items-center gap-space-xs px-space-md py-space-xs rounded-full bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md transition-all" data-category="Exam Prep" type="button">
<span class="material-symbols-outlined text-base">psychology</span>
<span>Exam Prep</span>
</button>
<button class="category-tag flex items-center gap-space-xs px-space-md py-space-xs rounded-full bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md transition-all" data-category="Lab" type="button">
<span class="material-symbols-outlined text-base">science</span>
<span>Lab</span>
</button>
<button class="category-tag flex items-center gap-space-xs px-space-md py-space-xs rounded-full bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md transition-all" data-category="Project" type="button">
<span class="material-symbols-outlined text-base">rocket_launch</span>
<span>Project</span>
</button>
</div>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-lg text-label-lg text-on-surface flex items-center justify-between" for="taskNotes">
<span>Description / Notes</span>
<span class="font-body-sm text-body-sm text-outline">Optional</span>
</label>
<textarea class="w-full bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md rounded-lg px-space-md py-space-sm focus:outline-none focus:bg-surface-container-high transition-colors resize-none" id="taskNotes" placeholder="Add rubric links, chapter pages, or office hours notes..." rows="3"></textarea>
</div>
<div class="flex items-center justify-between bg-surface-container-low rounded-lg p-space-md">
<div class="flex items-center gap-space-sm min-w-0">
<div class="w-9 h-9 rounded-lg bg-primary-container/20 text-primary flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">notifications_active</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-title-md text-title-md text-on-surface truncate">Smart Reminder</span>
<span class="font-body-sm text-body-sm text-on-surface-variant truncate" id="reminderHint">Nudge me 2 hours before due time</span>
</div>
</div>
<button aria-checked="true" class="relative w-12 h-7 rounded-full bg-primary-container transition-colors shrink-0 p-1" id="reminderToggle" role="switch" type="button">
<span class="block w-5 h-5 rounded-full bg-on-primary-container shadow-sm translate-x-5 transition-transform" id="reminderKnob"></span>
</button>
</div>
<div class="flex items-center gap-space-sm pt-space-xs">
<button class="flex-1 py-3 px-space-md rounded-lg bg-surface-container-high text-on-surface font-label-lg text-label-lg hover:bg-surface-bright transition-colors" id="cancelBtn" onclick="history.back()" type="button">
        Cancel
      </button>
<button class="flex-[2] py-3 px-space-md rounded-lg bg-gradient-to-r from-secondary-container to-primary-container text-on-primary-container font-label-lg text-label-lg shadow-lg flex items-center justify-center gap-space-xs active:scale-[0.98] transition-all" id="saveBtn" type="submit">
<span class="material-symbols-outlined text-xl" id="saveIcon">check_circle</span>
<span id="saveText">Save Task</span>
</button>
</div>
</form>
</div>
<script>
  (function () {
    const priorityPills = document.querySelectorAll('.priority-pill');
    const priorityStyles = {
      low: { active: ['bg-tertiary-container', 'text-on-tertiary-container', 'shadow-md'], inactive: ['bg-surface-container-lowest', 'text-on-surface-variant'] },
      medium: { active: ['bg-secondary-container', 'text-on-secondary-container', 'shadow-md'], inactive: ['bg-surface-container-lowest', 'text-on-surface-variant'] },
      high: { active: ['bg-error-container', 'text-on-error-container', 'shadow-md'], inactive: ['bg-surface-container-lowest', 'text-on-surface-variant'] }
    };

    priorityPills.forEach(pill => {
      pill.addEventListener('click', () => {
        const selected = pill.dataset.priority;
        priorityPills.forEach(p => {
          const type = p.dataset.priority;
          p.classList.remove(...priorityStyles[type].active, ...priorityStyles[type].inactive);
          if (type === selected) {
            p.classList.add(...priorityStyles[type].active);
          } else {
            p.classList.add(...priorityStyles[type].inactive);
          }
        });
      });
    });

    const categoryTags = document.querySelectorAll('.category-tag');
    categoryTags.forEach(tag => {
      tag.addEventListener('click', () => {
        categoryTags.forEach(t => {
          t.classList.remove('bg-primary-container', 'text-on-primary-container', 'shadow-sm');
          t.classList.add('bg-surface-container-lowest', 'text-on-surface-variant');
        });
        tag.classList.remove('bg-surface-container-lowest', 'text-on-surface-variant');
        tag.classList.add('bg-primary-container', 'text-on-primary-container', 'shadow-sm');
      });
    });

    const reminderToggle = document.getElementById('reminderToggle');
    const reminderKnob = document.getElementById('reminderKnob');
    const reminderHint = document.getElementById('reminderHint');
    let reminderOn = true;

    reminderToggle.addEventListener('click', () => {
      reminderOn = !reminderOn;
      reminderToggle.setAttribute('aria-checked', String(reminderOn));
      if (reminderOn) {
        reminderToggle.classList.remove('bg-surface-container-highest');
        reminderToggle.classList.add('bg-primary-container');
        reminderKnob.classList.add('translate-x-5');
        reminderKnob.classList.remove('translate-x-0');
        reminderHint.textContent = 'Nudge me 2 hours before due time';
      } else {
        reminderToggle.classList.remove('bg-primary-container');
        reminderToggle.classList.add('bg-surface-container-highest');
        reminderKnob.classList.remove('translate-x-5');
        reminderKnob.classList.add('translate-x-0');
        reminderHint.textContent = 'Reminders muted for this task';
      }
    });

    const form = document.getElementById('addTaskForm');
    const saveBtn = document.getElementById('saveBtn');
    const saveText = document.getElementById('saveText');
    const saveIcon = document.getElementById('saveIcon');

    form.addEventListener('submit', () => {
      const titleInput = document.getElementById('taskTitle');
      if (!titleInput.value.trim()) {
        titleInput.focus();
        return;
      }
      saveIcon.textContent = 'done_all';
      saveText.textContent = 'Task Saved!';
      saveBtn.classList.remove('from-secondary-container', 'to-primary-container');
      saveBtn.classList.add('bg-tertiary-container', 'text-on-tertiary-container');
      setTimeout(() => {
        saveIcon.textContent = 'check_circle';
        saveText.textContent = 'Save Task';
        saveBtn.classList.remove('bg-tertiary-container', 'text-on-tertiary-container');
        saveBtn.classList.add('from-secondary-container', 'to-primary-container');
      }, 1600);
    });
  })();
</script></main></body></html>
